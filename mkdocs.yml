site_name: Template API Docs
site_url: https://teplotax.github.io/doc-api-template-v1/

docs_dir: docs

nav:
  - Home: README.md
  - API Reference:
      - OpenAPI: openapi.md

theme:
  name: material

plugins:
  - search

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true