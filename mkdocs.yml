site_name: Template API Docs

docs_dir: .

nav:
  - Home: README.md
  - API Reference:
      - OpenAPI: openapi.json

theme:
  name: material

plugins:
  - search
  - openapi_markdown:
      enabled: true
      openapi_file: openapi.json
      output_file: README.md

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true